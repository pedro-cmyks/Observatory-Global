    <title>Atlas - Public Narrative Intelligence Console</title>
    <script>
      // Pre-hydration theme stamp (R3c P1: kills the dark→light loader flash —
      // variables.css paints the static intel-noir tokens until ThemeContext's
      // effect ran). Mirrors lib/consoleTheme.resolveConsoleThemeId exactly:
      // stored override (atlas-console-theme) > clock 19-7 night > OS dark.
      // ThemeContext re-resolves identically on mount, so the two never fight.
      (function () {
        try {
          var ids = { 'emerald-light': 1, 'emerald-dark': 1, 'intel-noir': 1, 'retro-radar': 1 };
          var stored = null;
          try { stored = localStorage.getItem('atlas-console-theme'); } catch (e) { /* private mode */ }
          var id = stored && ids[stored] ? stored : null;
          if (!id) {
            var h = new Date().getHours();
            var night = h >= 19 || h < 7;
            var osDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            id = (night || osDark) ? 'emerald-dark' : 'emerald-light';
          }
          document.documentElement.setAttribute('data-theme', id);
        } catch (e) { /* keep the static default */ }
      })();
    </script>
    <meta name="description" content="Atlas turns open global signals into a daily intelligence brief, live narrative map, anomaly alerts, country briefs, and investigation workspace." />
